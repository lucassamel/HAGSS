services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=hagss;Username=hagss;Password=hagss
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://hagss:hagss@rabbitmq:5672/
      Cors__AllowedOrigins__0: http://localhost:8081
      Cors__AllowedOrigins__1: http://monitor:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Monitor__ApiBaseUrl: http://api:8080
      Monitor__EventId: 11111111-1111-1111-1111-111111111111
      Monitor__SeatRefreshIntervalSeconds: 5
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.loadsimulator
    environment:
      Simulator__ApiBaseUrl: http://api:8080
      Simulator__StartupDelaySeconds: 15
      Simulator__RoundIntervalSeconds: 45
      Simulator__MinUsers: 1
      Simulator__MaxUsers: 1000
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hagss
      POSTGRES_USER: hagss
      POSTGRES_PASSWORD: hagss
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hagss -d hagss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hagss
      RABBITMQ_DEFAULT_PASS: hagss
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
